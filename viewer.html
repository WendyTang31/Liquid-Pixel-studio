<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morph Studio · 3D 车模预览</title>
<style>
  :root{ --bg:#0a0a0a; --panel:#161616; --line:#2a2a2a; --ink:#e8e8e4; --dim:#8a8a85; --mint:#98f5d0; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--ink); overflow:hidden;
        font-family:"IBM Plex Sans","Helvetica Neue",system-ui,sans-serif; }
  #scene{position:fixed; inset:0;}
  .bar{ position:fixed; top:10px; left:10px; right:10px; z-index:2;
        display:flex; align-items:center; gap:8px; flex-wrap:wrap;
        background:rgba(22,22,22,.9); border:1px solid var(--line); border-radius:8px;
        padding:8px 10px; backdrop-filter:blur(6px);}
  .bar h1{font-size:13px; font-weight:600; letter-spacing:.05em;}
  .spacer{flex:1}
  select,button{ background:#1e1e1e; color:var(--ink); border:1px solid var(--line);
                 border-radius:6px; padding:5px 8px; font-size:12px; cursor:pointer; font-family:inherit;}
  button:hover{border-color:var(--mint); color:var(--mint);}
  button.on{background:var(--mint); color:#000; border-color:var(--mint);}
  .ck{font-size:11.5px; color:var(--ink); display:flex; gap:4px; align-items:center;}
  input[type=checkbox]{accent-color:var(--mint)}
  .sl{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--dim);}
  .sl input[type=range]{width:76px; accent-color:var(--mint); height:16px;}
  .sl .val{font-size:10.5px; color:var(--mint); min-width:28px; text-align:right; font-variant-numeric:tabular-nums;}
  #hint{ position:fixed; left:12px; bottom:10px; z-index:2; font-size:11.5px; color:var(--dim);
         background:rgba(10,10,10,.6); padding:4px 8px; border-radius:6px; max-width:92vw;}
  a{color:var(--mint); text-decoration:none;}
</style>
</head>
<body>
<div class="bar">
  <h1>3D 车模预览</h1>
  <button id="loadProj">📂 工程</button>
  <button id="loadModel">🚗 车模 (.glb)</button>
  <select id="decSel" title="当前编辑哪块投影面(点击车身移动它)"></select>
  <button id="addDec" title="新增一块投影面(共享同一动画与时间线,可各取画面的不同区段)">➕面</button>
  <button id="delDec" title="删除当前投影面">🗑面</button>
  <span class="sl" title="投影贴片宽度">大小 <input type="range" id="szSl" min="0.3" max="3" step="0.05" value="1.2"><span class="val" id="szV">1.20</span></span>
  <span class="sl" title="绕表面法线旋转">旋转 <input type="range" id="rotSl" min="-180" max="180" step="1" value="0"><span class="val" id="rotV">0°</span></span>
  <span class="sl" title="沿表面横向微移">横移 <input type="range" id="uSl" min="-0.8" max="0.8" step="0.01" value="0"><span class="val" id="uV">0.00</span></span>
  <span class="sl" title="沿表面纵向微移">纵移 <input type="range" id="vSl" min="-0.8" max="0.8" step="0.01" value="0"><span class="val" id="vV">0.00</span></span>
  <span class="sl" title="本面取动画画面的哪一段(起点%);多面各取一段=动画跨面连续跑动">画面起 <input type="range" id="cxSl" min="0" max="0.9" step="0.01" value="0"><span class="val" id="cxV">0%</span></span>
  <span class="sl" title="本面取画面的宽度%">画面宽 <input type="range" id="cwSl" min="0.1" max="1" step="0.01" value="1"><span class="val" id="cwV">100%</span></span>
  <button id="pickBtn" title="吸管:点击车漆,把动画背景色同步成该颜色,贴片与车身融为一体">🎨吸色</button>
  <button id="eraseBtn" title="橡皮:在投影面上拖动,擦掉不想显示动画的区域">🧽橡皮</button>
  <span class="sl">粗细 <input type="range" id="eraSl" min="8" max="80" step="2" value="30"><span class="val" id="eraV">30</span></span>
  <button id="clearErase" title="恢复被擦除的区域">↺擦除</button>
  <span class="sl" title="环境曝光">亮度 <input type="range" id="expSl" min="0.2" max="2.4" step="0.05" value="1.15"><span class="val" id="expV">1.15</span></span>
  <label class="ck"><input type="checkbox" id="bloomCk" checked> 辉光</label>
  <label class="ck"><input type="checkbox" id="spinCk"> 环绕</label>
  <button id="expGlb" title="把车+投影面导出为 .glb,进 Blender 配合 PNG 序列做正片渲染">📤Blender</button>
  <div class="spacer"></div>
  <a href="./index.html">← 返回编辑器</a>
  <input type="file" id="projFile" accept=".json" style="display:none">
  <input type="file" id="modelFile" accept=".glb,.gltf" style="display:none">
</div>
<div id="scene"></div>
<div id="hint">点击车身放置当前投影面 · ➕面 增加投影面(同一动画,时间线同步)· 拖动旋转 · 滚轮缩放</div>
<script type="module" src="/src/viewer/main3d.js"></script>
</body>
</html>
